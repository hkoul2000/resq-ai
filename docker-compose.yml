version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - RESQAI_CONFIG=configs/default.yaml
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - RESQAI_API_URL=http://api:8000
    command: streamlit run app/dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
